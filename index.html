  +(sel?'<label>Catatan untuk siswa (wajib bila minta perbaikan)</label><input id="pb_c" maxlength="500"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" onclick="pbPutus(\''+x.id+'\',\'Lulus\')">Lulus</button><button class="g" style="margin-top:12px" onclick="pbPutus(\''+x.id+'\',\'Perlu perbaikan\')">Minta perbaikan</button><button class="g" style="margin-top:12px" onclick="PB.pil=\'\';R()">Batal</button></div>':(PB.peran=='Penyunting'?'<button class="b" onclick="PB.pil=\''+x.id+'\';PB.msg=\'\';R()">Putuskan</button>':'<div class="mu" style="margin-top:6px">Keputusan akhir oleh Penyunting.</div>'))+'</div>'}).join(''):'<div class="card mu">Tidak ada pengajuan yang menunggu.</div>')}
function pbPutus(uid,hasil){var c=($('pb_c')||{}).value||'';c=c.trim();if(hasil!='Lulus'&&!c){PB.err='Tulis catatan perbaikan untuk siswa.';return R()}PB.err='';
 apiP('ujiPutus',{uid:uid,hasil:hasil,catatan:c,src:'app'}).then(function(j){if(!j.ok){PB.err=j.error=='sudah_diputus'?'Sudah diputuskan sebelumnya.':'Gagal: '+(j.error||'');return pbMuat()}
  PB.L=PB.L.filter(function(x){return x.id!=uid});PB.pil='';PB.msg=hasil=='Lulus'?'Butir diluluskan.':'Perbaikan diminta.';R()}).catch(function(e){if(e!='keluar'){PB.err='Gagal mengirim.';R()}})}
function pbSiswa(){var D=PB.D||[],q=(PB.q||'').toLowerCase(),L=D.filter(function(x){return !q||(x.nama+' '+x.kelas+' '+x.nisn).toLowerCase().indexOf(q)>=0});
 return '<div class="card"><h2>Siswa ('+D.length+')</h2><input id="pb_q" placeholder="Cari nama, kelas, NISN" value="'+h(PB.q)+'" oninput="PB.q=this.value;pbCari()"></div><div id="pb_l">'+pbBaris(L)+'</div>'}
function pbBaris(L){return L.length?L.map(function(x){var s=x.s||{},lv=x.target&&s[x.target]?x.target:'Ramu',str=s[lv]||'',n=str.length,l=(str.match(/3/g)||[]).length,pc=n?Math.round(100*l/n):0;
 return '<div class="card" style="padding:10px 14px"><b>'+h(x.nama)+'</b> <span class="mu">'+h(x.kelas)+' · '+h(x.satuan)+'</span><div class="mu">Tingkat '+h(x.tingkat||'-')+' · Target '+h(x.target||'-')+' · '+l+'/'+n+' butir '+h(lv)+' ('+pc+'%)</div><div class="bar"><i style="width:'+pc+'%"></i></div></div>'}).join(''):'<div class="card mu">Tidak ada yang cocok.</div>'}
function pbCari(){var D=PB.D||[],q=(PB.q||'').toLowerCase();$('pb_l').innerHTML=pbBaris(D.filter(function(x){return !q||(x.nama+' '+x.kelas+' '+x.nisn).toLowerCase().indexOf(q)>=0}))}

function pbMateri(){var B=(PB.B||[]).filter(function(b){return b[1]==PB.lv}),ar={},ord=[];B.forEach(function(b){if(!ar[b[2]]){ar[b[2]]=[];ord.push(b[2])}ar[b[2]].push(b)});
 var tb='<div class="tabs">'+['Ramu','Rakit','Terap'].map(function(x){return '<button class="'+(PB.lv==x?'on':'')+'" onclick="PB.lv=\''+x+'\';R()">'+x+'</button>'}).join('')+'</div>';
 if(!B.length)return tb+'<div class="card mu">Materi belum dikirim dari SIM.</div>';
 return tb+ord.map(function(a){return '<div class="card"><h2>'+h(a)+'</h2>'+ar[a].map(function(b){return '<details><summary><b>'+h(b[0])+'</b> '+h(b[3])+'</summary>'+(b[4]?'<div class="mu"><b>Cara uji:</b> '+h(b[4])+'</div>':'')+(b[5]?'<div class="mu"><b>Bukti:</b> '+h(b[5])+'</div>':'')+(b[6]?'<div class="mu"><b>Catatan:</b> '+h(b[6])+'</div>':'')+(!b[4]&&!b[5]&&!b[6]?'<div class="mu">Belum ada keterangan tambahan.</div>':'')+'</details>'}).join('')+'</div>'}).join('')}
function pbPiagam(){var G=PB.G||[];return '<div class="card"><h2>Piagam &amp; penghargaan ('+G.length+')</h2><div class="mu">Seluruh siswa. Hanya melihat.</div></div>'+(G.length?G.map(function(x){return '<div class="pg"><b>'+h(x.nama)+'</b><div>'+h(x.jenis)+'</div>'+(x.ket?'<div>'+h(x.ket)+'</div>':'')+'<div>'+h(x.tgl||'')+(x.nomor?' · No. '+h(x.nomor):'')+'</div></div>'}).join(''):'<div class="card mu">Belum ada piagam yang dikirim dari SIM.</div>')}
function pbAlbum(){var A=PB.A||[];return '<div class="card"><h2>Album gudep ('+A.length+')</h2>'+(pbBisaIsi()?'<label>Untuk</label><select id="al_u"><option value="">Semua anggota gudep</option>'+(PB.D||[]).map(function(x){return '<option value="'+h(x.nisn)+'">Album pribadi: '+h(x.nama)+'</option>'}).join('')+'</select><label>Keterangan</label><input id="al_j" maxlength="120"><label>Pilih foto</label><input type="file" accept="image/*" onchange="pbAlbumTambah(this)">'+(PB.msg?'<div class="okm">'+h(PB.msg)+'</div>':''):'')+'</div>'+(A.length?'<div class="grid">'+A.map(function(x,i){return '<img src="'+x.foto+'" alt="'+h(x.judul)+'" onclick="pbLb('+i+')">'}).join('')+'</div>':'<div class="card mu">Belum ada foto album gudep.</div>')}
function pbLb(i){var x=(PB.A||[])[i];if(!x)return;$('lb').className='on';$('lb').innerHTML='<img src="'+x.foto+'" alt=""><div style="margin-top:8px">'+h(x.judul||'')+'</div><div><a href="#" style="color:#fff" onclick="lbTutup();return false">Tutup</a></div>'}

function pbOpt(sel){return '<option value="">— pilih siswa —</option>'+(PB.D||[]).slice().sort(function(a,b){return a.nama<b.nama?-1:1}).map(function(x){return '<option value="'+h(x.nisn)+'"'+(x.nisn==sel?' selected':'')+'>'+h(x.nama)+' ('+h(x.kelas)+')</option>'}).join('')}
function pbCek(){var d=(PB.D||[]).filter(function(x){return x.nisn==PB.cs})[0],o='<div class="card"><h2>Ceklist uji SKU</h2><div class="mu">Pilih siswa, lalu centang butir yang sudah kamu uji langsung. Keputusan Lulus akhir oleh Penyunting.</div><label>Siswa</label><select id="cs_s" onchange="PB.cs=this.value;PB.pil=\'\';R()">'+pbOpt(PB.cs)+'</select>'+(PB.msg?'<div class="okm">'+h(PB.msg)+'</div>':'')+'</div>';
 if(!d)return o;var lv=d.target||'Ramu',B=(PB.B||[]).filter(function(b){return b[1]==lv}),str=(d.s&&d.s[lv])||'';
 if(!B.length)return o+'<div class="card mu">Materi belum dikirim dari SIM.</div>';
 return o+'<div class="card"><h2>'+h(d.nama)+' · '+h(lv)+'</h2>'+B.map(function(b,i){var st=+str.charAt(i)||0,w=(PB.L||[]).filter(function(x){return x.nisn==d.nisn&&x.butir==b[0]})[0],ket='';
  if(st==3)ket='<span class="chip s3">Lulus</span>';else if(w)ket='<span class="chip s2">'+(w.status=='Direkomendasikan'?'Dicek '+h(w.oleh||''):'Diajukan siswa')+'</span>';
  else ket=(PB.pil==b[0]?'':'<button class="g" style="margin:0;padding:5px 10px" onclick="PB.pil=\''+h(b[0])+'\';R()">Teruji ✔</button>');
  return '<div class="row"><b>'+h(b[0])+'</b><span>'+h(b[3])+'</span>'+ket+(PB.pil==b[0]?'<div style="flex-basis:100%"><label>Catatan (opsional)</label><input id="ck_c" maxlength="400" placeholder="mis. praktik benar, 3 kali"><div style="display:flex;gap:8px"><button class="b" onclick="pbCekKirim(\''+h(b[0])+'\')">Simpan ceklist</button><button class="g" style="margin-top:12px" onclick="PB.pil=\'\';R()">Batal</button></div></div>':'')+'</div>'}).join('')+'</div>'}
function pbCekKirim(bt){var c=($('ck_c')||{}).value||'';PB.err='';apiP('cekUji',{nisn:PB.cs,butir:bt,catatan:c}).then(function(j){
  if(!j.ok){PB.err=({sudah_diajukan:'Butir ini sudah dicek atau diajukan.',sudah_lulus:'Butir ini sudah lulus.',butir:'Butir bukan tingkat target siswa.',tidak_boleh:'Akun ini tidak boleh mengisi.'})[j.error]||'Gagal: '+(j.error||'');return R()}
  PB.L=(PB.L||[]).concat([{id:j.id,nisn:PB.cs,butir:bt,status:'Direkomendasikan',oleh:PB.nama,diajukan:'baru saja',catatan:c}]);PB.pil='';PB.msg='Tersimpan. Menunggu keputusan akhir Penyunting.';R()}).catch(function(e){if(e!='keluar'){PB.err='Gagal mengirim.';R()}})}
function hariIni(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var KJ=['Latihan Mingguan','Pelantikan','Bakti Lingkungan','Perkemahan','Lomba','Lainnya'];
function pbKeg(){var K=PB.K||[];
 return '<div class="card"><h2>Isi kegiatan</h2><div class="mu">Langsung masuk ke Rekap Kegiatan SIM tanpa persetujuan.</div>'
 +'<label>Tanggal</label><input id="kg_t" type="date" value="'+hariIni()+'"><label>Nama kegiatan</label><input id="kg_n" maxlength="120"><label>Tempat</label><input id="kg_p" maxlength="120">'
 +'<label>Jenis</label><select id="kg_j">'+KJ.map(function(x){return '<option>'+h(x)+'</option>'}).join('')+'</select><label>Status</label><select id="kg_s"><option>Selesai</option><option>Berjalan</option><option>Direncanakan</option></select>'
 +'<label>Resume kegiatan</label><textarea id="kg_r" rows="5" maxlength="1500" placeholder="Apa yang dilakukan, hasil, siapa yang hadir, catatan penting"></textarea>'
 +'<label>Foto kegiatan (opsional, masuk ke album gudep)</label><input id="kg_f" type="file" accept="image/*">'
 +'<button class="b" onclick="pbKegKirim()">Simpan kegiatan</button>'+(PB.msg?'<div class="okm">'+h(PB.msg)+'</div>':'')+'</div>'
 +'<div class="card"><h2>Kegiatan terbaru ('+K.length+')</h2>'+(K.length?K.slice(0,30).map(function(k){var mine=k.penulis==PB.nama&&!k.sim||PB.peran=='Penyunting';return '<details><summary><b>'+h(k.tema)+'</b> <span class="mu">'+h(k.tgl)+' · '+h(k.penulis)+'</span></summary><div class="mu">'+h(k.jenis)+' · '+h(k.tempat||'-')+' · '+h(k.status)+(k.sim?' · sudah di SIM':'')+'</div><div style="margin-top:4px;white-space:pre-wrap">'+h(k.resume)+'</div>'+(mine?'<button class="g" onclick="pbKegHapus(\''+k.id+'\')">Hapus</button>':'')+'</details>'}).join(''):'<div class="mu">Belum ada kegiatan.</div>')+'</div>'}
function pbKegKirim(){var g=function(i){return ($(i)||{}).value||''},f=$('kg_f')&&$('kg_f').files[0],o={tgl:g('kg_t'),tema:g('kg_n').trim(),tempat:g('kg_p').trim(),jenis:g('kg_j'),status:g('kg_s'),resume:g('kg_r').trim()};PB.err='';PB.msg='';
 if(o.tema.length<3){PB.err='Isi nama kegiatan.';return R()}if(o.resume.length<10){PB.err='Resume minimal 10 huruf.';return R()}
 apiP('kegiatanTambah',o).then(function(j){if(!j.ok){PB.err=({tanggal:'Tanggal tidak valid.',tema:'Isi nama kegiatan.',resume:'Resume minimal 10 huruf.',tidak_boleh:'Akun ini tidak boleh mengisi.'})[j.error]||'Gagal: '+(j.error||'');return R()}
  PB.K=[{id:j.id,tgl:o.tgl,tema:o.tema,tempat:o.tempat,jenis:o.jenis,status:o.status,resume:o.resume,penulis:PB.nama,sim:false}].concat(PB.K||[]);PB.msg='Kegiatan tersimpan.';
  if(f)kecil(f,640,0,44000,function(d){apiP('albumTambahPembina',{foto:d,judul:o.tema}).then(function(){PB.msg='Kegiatan dan foto tersimpan.';R()})},false);else R()}).catch(function(e){if(e!='keluar'){PB.err='Gagal mengirim.';R()}})}
function pbKegHapus(id){if(!confirm('Hapus kegiatan ini?'))return;apiP('kegiatanHapus',{kid:id}).then(function(j){if(!j.ok){PB.err=j.error=='tidak_boleh'?'Sudah dicatat di SIM, tidak bisa dihapus dari sini.':'Gagal.';return R()}PB.K=PB.K.filter(function(k){return k.id!=id});R()}).catch(function(){})}
function pbAlbumTambah(inp){var f=inp.files[0];if(!f)return;var u=($('al_u')||{}).value||'',t=($('al_j')||{}).value||'';PB.err='';PB.msg='Mengirim…';R();kecil(f,640,0,44000,function(d){apiP('albumTambahPembina',{foto:d,judul:t,nisn:u}).then(function(j){if(!j.ok){PB.msg='';PB.err='Gagal: '+(j.error||'');return R()}if(!u)PB.A=[{id:j.id,judul:t,tgl:'baru saja',foto:d}].concat(PB.A||[]);PB.msg=u?'Foto ditambahkan ke album siswa.':'Foto ditambahkan ke album gudep.';R()}).catch(function(e){if(e!='keluar'){PB.msg='';PB.err='Gagal mengirim.';R()}})},false)}
R();insShow();
</script></body></html>
